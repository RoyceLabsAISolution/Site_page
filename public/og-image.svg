<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Royce Labs AI Solutions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0369A1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#0369A1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0369A1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo mark -->
  <g transform="translate(96,86)">
    <rect x="1.5" y="1.5" width="70" height="70" rx="18" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <path d="M24 54V20h16a10 10 0 0 1 3 19.5L52 54h-8l-8-10h-4v10h-8z" fill="url(#accent)"/>
  </g>
  <text x="188" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#EAF1FB">Royce Labs AI Solutions</text>

  <!-- Headline -->
  <text x="96" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="800" fill="#EAF1FB">Run your business</text>
  <text x="96" y="392" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="800" fill="url(#accent)">smarter with AI.</text>

  <!-- Subline -->
  <text x="96" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="500" fill="#9FB0C7">Done-for-you AI automation for small businesses.</text>
  <text x="96" y="512" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="500" fill="#9FB0C7">We don&apos;t just add AI — we redesign the work around it.</text>

  <!-- Footer tag -->
  <text x="96" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#38BDF8">roycelabs.pages.dev</text>
</svg>
